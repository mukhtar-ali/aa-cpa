name: Deploy to VPS

# Self-hosted deployment (docs/DEPLOY_VPS.md path B). OFF until the repository variable VPS_DEPLOY_ENABLED is "true",
# so pushes deployed by Coolify are not affected.
#
#   main passes CI  -> staging (automatic) -> production (waits for approval by the environment's required reviewers)
#   Run workflow    -> choose environment, optionally a SHA tag to roll back to (rollback skips the build)
#
# Each environment has its own images, secrets and variables; see deploy-vps-env.yml for the names.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging
      rollback_tag:
        description: Existing image tag (commit SHA) to roll back to; empty builds and deploys the selected commit
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  staging:
    if: >-
      vars.VPS_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
    uses: ./.github/workflows/deploy-vps-env.yml
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      rollback_tag: ${{ inputs.rollback_tag || '' }}
    secrets: inherit

  production:
    needs: staging
    if: >-
      vars.VPS_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-vps-env.yml
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  # Manual production run (deploy the chosen commit, or roll back to a tag). Still gated by the production environment.
  production-manual:
    if: >-
      vars.VPS_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    uses: ./.github/workflows/deploy-vps-env.yml
    with:
      environment: production
      ref: ${{ github.sha }}
      rollback_tag: ${{ inputs.rollback_tag || '' }}
    secrets: inherit
