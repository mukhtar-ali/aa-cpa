name: Security scans

# Feature 004 (FR-031/032): dependency audit and image vulnerability scan. Kept out of ci.yml so a flaky advisory feed
# never blocks ordinary pushes; it runs on pull requests, on main, and weekly (new advisories appear without code changes).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # .npmrc pins store-dir to a Windows/WSL drive (/mnt/e) for local work; runners have no such path.
  npm_config_store_dir: ${{ runner.temp }}/pnpm-store

jobs:
  audit:
    name: pnpm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Fails on any high or critical advisory that ships to production.
      - run: pnpm audit --prod --audit-level high

  trivy:
    name: Trivy ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [api, admin, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          load: true
          tags: aacpa/${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
      - name: Scan (fail on fixed HIGH/CRITICAL, OS and libraries)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aacpa/${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
